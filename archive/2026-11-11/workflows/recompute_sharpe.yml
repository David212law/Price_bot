name: Recompute Sharpe
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/recompute_sharpe.py 2>&1 | tee data/recompute_sharpe_output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f research_lab/logs/profiles/state.json data/recompute_sharpe_output.txt
          git diff --cached --quiet || (git commit -m "Auto: recompute Sharpe for all 9035 strategies [skip ci]" && git pull --rebase origin main && git push)
