name: Merge All Strategies
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy
      - run: python scripts/merge_all_strategies.py 2>&1 | tee data/merge_strategies_output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f research_lab/logs/profiles/returns_matrices/wallex/ data/merge_strategies_output.txt
          git diff --cached --quiet || (git commit -m "Auto: merge 306 parametric strategies for Wallex [skip ci]" && git pull --rebase origin main && git push)
