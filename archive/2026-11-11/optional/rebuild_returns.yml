name: Rebuild All Returns
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy
      - run: python scripts/rebuild_all_returns.py 2>&1 | tee data/rebuild_returns_output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f research_lab/logs/profiles/returns_matrices/ data/rebuild_returns_output.txt
          git diff --cached --quiet || (git commit -m "Auto: rebuild all returns [skip ci]" && git pull --rebase origin main && git push)
