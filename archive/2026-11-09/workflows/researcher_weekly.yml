name: Researcher v3 Weekly

on:
  schedule:
    - cron: '0 4 * * 1'  # دوشنبه 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Researcher v3
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: PYTHONPATH=. python3 -m research_lab.researcher_v3.main
      - name: Commit results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add research_lab/logs/researcher_v3/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: researcher v3 $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main || true
          git push || echo "push failed"
