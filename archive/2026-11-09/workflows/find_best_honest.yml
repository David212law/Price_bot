name: Find Best Honest Per Regime
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/find_best_honest.py'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/find_best_honest.py 2>&1 | tee data/best_honest_output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ || true
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Auto: honest best per regime [skip ci]"
            git push
          fi
