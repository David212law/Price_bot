name: Live Analyzer (Weekly)

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run Live Analyzer
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python -m research_lab.live_analyzer
      - name: Commit report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f research_lab/logs/live_reports/ || true
          git add -f research_lab/logs/live_data/ || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto: live analyzer $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main || true
            git push || echo "push failed"
          else
            echo "No changes to commit"
          fi
