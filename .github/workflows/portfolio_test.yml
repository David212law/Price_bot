name: Portfolio Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/portfolio_test.py'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/portfolio_test.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/portfolio_test.json
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Auto: portfolio backtest [skip ci]"
            git push
          fi
