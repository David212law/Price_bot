name: Wallex V3 Hybrid Paper

on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallex-v3
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run v3 hybrid
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python3 exchanges/wallex/v3_hybrid_bot.py
      - name: Commit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add exchanges/wallex/state/v3_hybrid_state.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto: v3 hybrid state $(date -u +%Y-%m-%d-%H) [skip ci]"
            git pull --rebase origin main || true
            git push || echo "push failed"
          fi
