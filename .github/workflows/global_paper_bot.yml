name: Global Paper Bot
on:
  workflow_dispatch:
  schedule: [{cron: "0 12 * * *"}]
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy
      - run: python scripts/global_paper_bot.py 2>&1 | tee -a data/global_paper_bot.log
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ || true
          git diff --cached --quiet || (git commit -m "Auto: Global Paper Bot [skip ci]" && git pull --rebase origin main && git push)
