name: Robot Full Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/robot_full_test.py'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/robot_full_test.py 2>&1 | tee data/robot_full_test_output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/robot_full_test_output.txt
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Auto: robot full test [skip ci]"
            git push
          fi
