name: Walk-Forward v28.7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python scripts/walk_forward_test.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/walk_forward_results.json archive/walk_forward/ || true
          git diff --cached --quiet || (git commit -m "Auto: walk-forward v28.7 [skip ci]" && git pull --rebase --autostash origin main && git push)
