name: Reproducibility Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 6'  # هر شنبه ۲ صبح UTC

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: pip install pandas numpy
      
      - name: Run reproducibility test
        run: python scripts/reproducibility_test.py
      
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/reproducibility/ || true
          git diff --cached --quiet || (git commit -m "Auto: reproducibility test [skip ci]" && git pull --rebase --autostash origin main && git push)
