name: Hybrid Backtest (43 strategies)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'   # هر یکشنبه ۴ صبح UTC

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas numpy

      - name: Run Backtest
        run: python scripts/hybrid_backtest.py 2>&1 | tee -a data/hybrid_backtest.log

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hybrid_strategy_scores.json 2>/dev/null || true
          git add data/hybrid_backtest.log 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Auto: Hybrid backtest $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase --autostash origin main && git push) || true
