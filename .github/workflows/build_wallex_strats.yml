name: Build Wallex Advanced Strategies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python3 scripts/build_wallex_strategies.py
      - name: Commit returns
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f research_lab/logs/profiles/returns_matrices/wallex/
          git commit -m "Auto: Wallex advanced strategies returns [skip ci]" || echo "No changes"
          git push
