name: Wallex Hybrid (Paper)

on:
  workflow_dispatch:
  schedule:
    - cron: '20 */4 * * *'   # :20 — بین Aster (:15) و KuCoin (:30)

permissions:
  contents: write

concurrency:
  group: state-commits
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas numpy requests

      - name: Run Researcher
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python scripts/hybrid_researcher.py 2>&1 | tee -a data/hybrid.log

      - name: Run Bot
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python scripts/hybrid_bot.py 2>&1 | tee -a data/hybrid.log

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hybrid_weights.json 2>/dev/null || true
          git add data/hybrid_state.json 2>/dev/null || true
          git add data/hybrid.log 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Auto: Hybrid state $(date -u +%Y-%m-%d-%H) [skip ci]" && git pull --rebase --autostash origin main && git push) || true
