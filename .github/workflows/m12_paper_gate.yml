name: M12 Paper Gate (heavy)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run PaperSim windows (fee_mode=0)
        run: |
          set -euo pipefail
          mkdir -p m12/bot/papersim_gate_logs
          for w in 120 240; do
            echo "---- window=$w fee_mode=0 ----"
            python3 -u m12/bot/paper_sim.py --window "$w" --max_pos 2 --fee_mode 0 \
              > "m12/bot/papersim_gate_logs/papersim_w${w}_fee0.log" 2>&1
            tail -n 25 "m12/bot/papersim_gate_logs/papersim_w${w}_fee0.log"
          done

      - name: Run PaperSim windows (fee_mode=default)
        run: |
          set -euo pipefail
          for w in 120 180 240 300 360; do
            echo "---- window=$w fee_mode=default ----"
            python3 -u m12/bot/paper_sim.py --window "$w" --max_pos 2 --fee_mode default \
              > "m12/bot/papersim_gate_logs/papersim_w${w}_feedefault.log" 2>&1
            tail -n 25 "m12/bot/papersim_gate_logs/papersim_w${w}_feedefault.log"
          done
