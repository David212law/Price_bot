name: Fetch All Wallex Data
on:
  workflow_dispatch:
  push:
    paths: ['scripts/fetch_wallex_full.py']
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/fetch_wallex_full.py 2>&1 | tee data/fetch_wallex_output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/wallex_tmn_all.json data/wallex_usdt_all.json data/fetch_wallex_output.txt
          git diff --cached --quiet || (git commit -m "Auto: full Wallex fetch (TMN + USDT) [skip ci]" && git pull --rebase origin main && git push)
