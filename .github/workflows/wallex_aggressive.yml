name: Wallex Aggressive (Paper)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy
      - run: python scripts/wallex_paper_bot_aggressive.py 2>&1 | tee -a data/wallex_aggressive.log
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ || true
          git diff --cached --quiet || (git commit -m "Auto: Wallex Aggressive State [skip ci]" && git pull --rebase --autostash origin main && git push)
