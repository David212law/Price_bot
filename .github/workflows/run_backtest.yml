name: Unified Backtest Runner

on:
  workflow_dispatch:
    inputs:
      exchange:
        description: 'Exchange (kucoin or aster)'
        required: true
        default: 'kucoin'
      strategy:
        description: 'Strategy (M35)'
        required: true
        default: 'M35'

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Engine
        env:
          EXCHANGE: ${{ github.event.inputs.exchange }}
          STRATEGY: ${{ github.event.inputs.strategy }}
        run: |
          python -c "from strategies.core_engine import run; import os; run(os.environ['EXCHANGE'], os.environ['STRATEGY'])"
      - name: Commit Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/backtest_results/
          git commit -m "Backtest result: ${{ github.event.inputs.strategy }} on ${{ github.event.inputs.exchange }}" || echo "No changes"
          git push
