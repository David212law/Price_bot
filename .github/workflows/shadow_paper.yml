name: Shadow Paper

on:
  schedule:
    - cron: '15 */4 * * *'   # :15 — بین Aster (:10) و KuCoin (:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-commits
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: HL Shadow (M31+Keltner all regimes)
        continue-on-error: true
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python exchanges/hyperliquid/m11_hl_shadow_allocator.py

      - name: Aster Shadow TREND (Keltner in TREND)
        continue-on-error: true
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python exchanges/aster/m11_aster_shadow_trend_allocator.py

      - name: Commit shadow states
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add exchanges/hyperliquid/state/m11_hl_shadow_portfolio.json 2>/dev/null || true
          git add exchanges/aster/state/m11_aster_shadow_trend_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: shadow states $(date -u +%Y-%m-%d-%H) [skip ci]" || true
          git pull --rebase origin main || true
          git push || echo "push failed"
