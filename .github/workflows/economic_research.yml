name: Economic Research (Manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "full"
        type: choice
        options:
          - full         # generator + runner + filter
          - generator    # only generator (fast)
          - runner       # only runner (medium)

permissions:
  contents: write

jobs:
  economic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Run health check (sanity)
        run: PYTHONPATH=. python3 -m research_lab.health_check
        continue-on-error: true

      - name: Generate strategy definitions
        if: inputs.mode == 'full' || inputs.mode == 'generator'
        run: PYTHONPATH=. python3 -m research_lab.economic_generator

      - name: Run economic strategies (backtest)
        if: inputs.mode == 'full' || inputs.mode == 'runner'
        run: PYTHONPATH=. python3 -m research_lab.economic_runner

      - name: Run filter (composer)
        if: inputs.mode == 'full'
        run: PYTHONPATH=. python3 -m research_lab.composer
        continue-on-error: true

      - name: Commit results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto: economic research $(date -u +%Y-%m-%d-%H) [skip ci]"
            git pull --rebase origin main || true
            git push || echo "push failed"
          else
            echo "No changes to commit"
          fi

      - name: Print summary
        if: always()
        run: |
          echo "===== Economic Research Summary ====="
          cat research_lab/logs/generated/economic_v1_results.json 2>/dev/null | head -100 || echo "No results"
