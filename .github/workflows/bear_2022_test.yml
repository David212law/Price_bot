name: Bear 2022 Test
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy
      - run: python scripts/test_bear_2022.py 2>&1 | tee data/bear_2022_output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/bear_2022_output.txt
          git diff --cached --quiet || (git commit -m "Auto: bear 2022 test results [skip ci]" && git pull --rebase origin main && git push)
