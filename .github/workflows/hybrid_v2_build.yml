name: Hybrid v2 Build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy
      - run: python scripts/hybrid_v2_builder.py 2>&1 | tee data/hybrid_v2.log
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hybrid_v2_final.json data/hybrid_v2.log 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Auto: Hybrid v2 $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase --autostash origin main && git push) || true
