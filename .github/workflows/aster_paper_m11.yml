name: M11-Aster Paper Engine

on:
  schedule:
    - cron: '10 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-aster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run Aster Engine
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python exchanges/aster/m11_aster_allocator.py
      - name: Commit state to repo (D-389)
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add exchanges/aster/state/ || echo "no state dir"
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Update Aster state [skip ci]" || echo "no changes to commit"
          git pull --rebase origin main || true
          git push || echo "push failed"
