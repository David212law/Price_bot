name: Auto Strategy Scanner

on:
  workflow_dispatch:
    inputs:
      exchange:
        description: 'Exchange (kucoin or aster)'
        required: true
        default: 'kucoin'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Scanner
        env:
          EXCHANGE: ${{ github.event.inputs.exchange }}
        run: |
          python -c "from strategies.auto_scanner import scan_exchange; import os; scan_exchange(os.environ['EXCHANGE'])"
      - name: Commit Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/auto_scan/
          git commit -m "Auto-Scan results for ${{ github.event.inputs.exchange }}" || echo "No changes"
          git push
