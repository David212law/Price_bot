name: M12 Agent (project manager)

on:
  schedule: [{ cron: '0 3 * * 3' }]
  workflow_dispatch:

permissions: { contents: write }

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Agent self-test
        run: python3 -u m12/agent_self_test.py

      - name: Agent full scan + safe-fix + auto-commit
        run: |
          python3 -u m12/agent.py --safe-fix --auto-fix --auto-commit --allow-dirty || echo "agent exited nonzero"
          git status --short

      - name: Show report
        if: always()
        run: cat m12/agent_report.txt || echo "(no report)"
