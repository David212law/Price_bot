name: M12 Agent Full
on:
  schedule: [{cron: '0 */6 * * *'}]
  workflow_dispatch:
  push:
    paths: ['m12/**.py']
permissions: {contents: write}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          python3 -u m12/agent.py --auto-fix --auto-commit --bale
          python3 -u m12/agent.py --health --next --bale --quiet
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@bot
          git add m12/agent_health.json m12/agent_report.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "auto(agent-health) [skip ci]"
          git pull --rebase origin main || true
          git push || echo fail
