name: M12 Agent Check
on:
  push:
    paths: ['m12/**.py']
  pull_request:
    paths: ['m12/**.py']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python3 -u m12/agent.py
