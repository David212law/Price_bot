name: M12 Agent (project manager)

on:
  schedule: [{ cron: '0 3 * * 3' }]
  workflow_dispatch:

permissions: { contents: write }

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Agent self-test
        run: python3 -u m12/agent_self_test.py

      - name: Agent full scan
        run: python3 -u m12/agent.py

      - name: Show report
        if: always()
        run: cat m12/agent_report.txt

      - name: Commit agent report
        if: success()
        run: |
          git config user.name bot
          git config user.email bot@bot
          git add m12/agent_report.txt m12/agent_health.json || true
          git diff --staged --quiet || git commit -m "Auto: M12 agent report [skip ci]"
          git pull --rebase origin main || true
          git push || echo fail
