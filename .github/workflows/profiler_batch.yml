name: Profiler Batch (by family)

on:
  workflow_dispatch:
    inputs:
      family:
        description: 'Family to profile'
        required: true
        type: choice
        options:
          - funding
          - trend
          - mr
          - momentum
          - vol
          - volume

permissions:
  contents: write

concurrency:
  group: profiler-batch
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run Profiler for Family
        run: python -m research_lab.profiler --family ${{ inputs.family }}
      - name: Commit State
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f research_lab/logs/profiles/ || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto: profiler batch ${{ inputs.family }} [skip ci]"
            git pull --rebase origin main || true
            git push || echo "push failed"
          else
            echo "No changes to commit"
          fi
