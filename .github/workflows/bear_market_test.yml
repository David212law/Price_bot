name: Bear Market Test
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy
      - run: python scripts/fetch_binance_2022.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/crypto_2022_bear.json
          git diff --cached --quiet || (git commit -m "Auto: fetched Binance 2022 bear data [skip ci]" && git pull --rebase origin main && git push)
