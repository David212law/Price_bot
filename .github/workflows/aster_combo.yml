name: Aster COMBO Paper
on:
  schedule:
    - cron: '40 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aster-combo
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Aster COMBO
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python exchanges/aster/m11_aster_combo_allocator.py
      - name: Commit state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add exchanges/aster/state/m11_aster_combo_paper_state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Aster COMBO state [skip ci]"
            git pull --rebase origin main || true
          git push || echo "push failed"
          fi
