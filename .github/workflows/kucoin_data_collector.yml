name: KuCoin Data Collector

on:
  schedule:
    - cron: '45 0 * * *' # اجرا روزانه ساعت 00:45 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Build History
        run: python exchanges/kucoin/build_history.py
      - name: Commit and Push Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add exchanges/kucoin/data/
          git commit -m "Automated: Update KuCoin historical data" || echo "No changes to commit"
          git push
