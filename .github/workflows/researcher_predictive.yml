name: Predictive Researcher
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"  # دوشنبه و پنجشنبه ساعت ۳ بامداد
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy
      - name: Fetch Live Wallex Data
        run: python scripts/fetch_wallex_fast.py
      - name: Run Predictive Researcher
        run: python scripts/researcher_predictive.py 2>&1 | tee data/researcher_predictive_output.txt
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
      - name: Auto-approve stable strategies
        run: python scripts/auto_approve_v3.py
      - name: Commit Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ || true  # includes pending
          git diff --cached --quiet || (git commit -m "Auto: Researcher PENDING approval [skip ci]" && git pull --rebase origin main && git push)
