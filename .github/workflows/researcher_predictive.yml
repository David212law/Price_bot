name: Predictive Researcher
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 */3 * *"
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy requests
      - name: Fetch Live Wallex Data
        run: python scripts/fetch_wallex_fast.py
      - name: Run Researcher + Commit (atomic)
        run: |
          python scripts/researcher_predictive.py 2>&1 | tee data/researcher_predictive_output.txt
          
          echo "═══ PENDING CREATED ═══"
          ls -la data/researcher_pending.json
          echo ""
          echo "═══ GIT STATUS BEFORE ADD ═══"
          git status --short
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # فقط pending — فایل‌های A/B در Termux ساخته می‌شوند
          git add data/researcher_pending.json data/researcher_predictive_output.txt data/wallex_tmn_all.json data/wallex_usdt_all.json
          
          echo "═══ GIT STATUS AFTER ADD ═══"
          git status --short
          
          git commit -m "Auto: Researcher + A/B files [skip ci]" || echo "nothing to commit"
          
          echo "═══ PULL BEFORE PUSH (avoid conflict) ═══"
          git pull --rebase origin main || echo "pull failed"
          
          echo "═══ PUSH ═══"
          git push origin main || echo "push failed"
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
