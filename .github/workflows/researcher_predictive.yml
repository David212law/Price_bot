name: Predictive Researcher
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 */3 * *"
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy requests
      - name: Fetch Live Wallex Data
        run: python scripts/fetch_wallex_fast.py
      - name: Run Predictive Researcher
        run: python scripts/researcher_predictive.py 2>&1 | tee data/researcher_predictive_output.txt
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
      - name: Verify Files
        run: |
          echo "=== FILE SIZES BEFORE COMMIT ==="
          wc -c data/researcher_conservative.json data/researcher_aggressive.json
          head -c 200 data/researcher_conservative.json
      - name: Upload A/B Files via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 scripts/upload_to_github.py
      - name: Commit Pending via Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/researcher_pending.json data/researcher_predictive_output.txt data/wallex_tmn_all.json data/wallex_usdt_all.json
          git commit -m "Auto: Researcher PENDING [skip ci]" || echo "nothing to commit"
          git push origin main || echo "push failed"
