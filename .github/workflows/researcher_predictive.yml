name: Predictive Researcher
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # هر دوشنبه ساعت ۳ بامداد UTC
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy
      - run: python scripts/researcher_predictive.py 2>&1 | tee data/researcher_predictive_output.txt
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/researcher_predictive_results.json data/researcher_predictive_output.txt
          git diff --cached --quiet || (git commit -m "Auto: predictive researcher weekly update [skip ci]" && git pull --rebase origin main && git push)
