name: Reports

on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 23 * * *'
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Which report'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - daily
          - analytics
          - dashboard

permissions:
  contents: write

jobs:
  daily:
    if: |
      github.event.inputs.task == 'daily' ||
      github.event.inputs.task == 'all' ||
      github.event.schedule == '0 20 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests urllib3
      - name: Run Daily Report
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python reports/daily_report.py

  analytics:
    if: |
      github.event.inputs.task == 'analytics' ||
      github.event.inputs.task == 'all' ||
      github.event.schedule == '0 23 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run Analytics
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python reports/analytics_engine.py

  dashboard:
    if: |
      github.event.inputs.task == 'dashboard' ||
      github.event.inputs.task == 'all' ||
      github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    concurrency:
      group: state-commits
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Update tracker
        run: python -m research_lab.kucoin_combo_tracker
      - name: Generate dashboard
        run: python -m research_lab.dashboard_full
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f exchanges/kucoin/state/m11_kucoin_shadow_combo_state.json || true
          git add -f reports/dashboard.html || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto: dashboard update [skip ci]"
            git push
          fi
