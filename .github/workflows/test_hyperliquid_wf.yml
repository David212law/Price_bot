name: Test Hyperliquid Walk-Forward

on:
  workflow_dispatch:

jobs:
  run-wf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run WF Test
        run: python test_hyperliquid_funding_wf.py
