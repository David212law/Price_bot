name: Validation Suite (Parity & KuCoin)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: KuCoin Strategy Validation
        run: python -m research_lab.kucoin_validator
      - name: Run HRP with Filtering
        run: python -m research_lab.hrp_optimizer
      - name: Upload Logs as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs
          path: research_lab/logs/
          retention-days: 30
