name: Validation Suite (Parity & KuCoin)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests numpy scipy
      - name: KuCoin Strategy Validation
        run: python -m research_lab.kucoin_validator
      - name: Run HRP with Filtering
        run: python -m research_lab.hrp_optimizer
      - name: Commit Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add research_lab/logs/
          git commit -m "Validation: KuCoin eligibility and filtered HRP" || echo "No changes"
          git push
