name: M12 Verify
on:
  workflow_dispatch:
  schedule: [{cron: '30 3 * * 6'}]
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python3 m12/calc_test.py
      - run: cd m12/researcher && python3 verify.py
