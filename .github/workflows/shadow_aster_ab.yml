name: Aster Shadow A/B
on:
  schedule:
    - cron: '25 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: state-commits
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Balanced (M31=50% + Keltner=50%)
        continue-on-error: true
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python exchanges/aster/m11_aster_shadow_balanced_allocator.py

      - name: RiskParity (M31=98% + Keltner=2%)
        continue-on-error: true
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python exchanges/aster/m11_aster_shadow_rp_allocator.py

      - name: Aster Shadow LV (M31=97% + LOW_VOL_CARRY=3%)
        continue-on-error: true
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python exchanges/aster/m11_aster_shadow_lv_allocator.py

      - name: Commit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add exchanges/aster/state/m11_aster_shadow_balanced_state.json 2>/dev/null || true
          git add exchanges/aster/state/m11_aster_shadow_rp_state.json 2>/dev/null || true
          git add exchanges/aster/state/m11_aster_shadow_lv_state.json 2>/dev/null || true 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: Aster shadow A/B $(date -u +%Y-%m-%d-%H) [skip ci]" || true
          git push || echo "push failed"
