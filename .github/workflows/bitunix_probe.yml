name: Bitunix Connectivity Probe

on:
  workflow_dispatch:

jobs:
  run-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run Probe
        run: python exchanges/bitunix/probe_api.py
