name: Expand KuCoin Data (Parallel)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 6
      matrix:
        symbol: [XBTUSDTM, ETHUSDTM, SOLUSDTM, BNBUSDTM, XRPUSDTM, AVAXUSDTM]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: pip install requests
      - name: Fetch ${{ matrix.symbol }}
        run: python research_lab/fetch_kucoin_extended.py ${{ matrix.symbol }}
      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add exchanges/kucoin/data/${{ matrix.symbol }}_4h.json
          git commit -m "data: expand ${{ matrix.symbol }}" || echo "no changes"
          git push
        continue-on-error: true
