name: Expand KuCoin Data (Sequential)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-all-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: pip install requests
      - name: Fetch All Symbols
        run: |
          for sym in XBTUSDTM ETHUSDTM SOLUSDTM BNBUSDTM XRPUSDTM AVAXUSDTM; do
            echo "═══ Fetching $sym ═══"
            python research_lab/fetch_kucoin_extended.py $sym
          done
      - name: Commit and Push All
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add exchanges/kucoin/data/
          git commit -m "data: expand KuCoin 4h data for 6 symbols (3 years)" || echo "no changes"
          git push
