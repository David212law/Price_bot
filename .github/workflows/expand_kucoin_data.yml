name: Expand KuCoin Data (Sequential, 3 years)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-all-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: pip install requests
      - name: Fetch All 6 Symbols
        run: |
          for sym in XBTUSDTM ETHUSDTM SOLUSDTM BNBUSDTM XRPUSDTM AVAXUSDTM; do
            echo "════════════════════════════════════"
            echo "Fetching $sym..."
            echo "════════════════════════════════════"
            python research_lab/fetch_kucoin_extended.py $sym
          done
      - name: Commit and Push All
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add exchanges/kucoin/data/
          git commit -m "data: expand KuCoin to 3 years for 5 symbols" || echo "no changes"
          git push
