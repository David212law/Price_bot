name: Researcher Aggressive (max 20)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy requests
      - run: python scripts/fetch_wallex_fast.py
      - run: python scripts/researcher_aggressive.py 2>&1 | tee data/researcher_aggressive_output.txt
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ || true
          git diff --cached --quiet || (git commit -m "Auto: Researcher Aggressive [skip ci]" && git pull --rebase --autostash origin main && git push)
