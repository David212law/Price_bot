name: Researcher Aggressive (max 20)
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas numpy requests
      - run: python scripts/researcher_aggressive.py 2>&1 | tee data/researcher_aggressive_output.txt
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/researcher_aggressive_pending.json data/researcher_aggressive_output.txt data/researcher_aggressive_full.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Auto: Researcher Aggressive [skip ci]" && git pull --rebase --autostash origin main && git push)
