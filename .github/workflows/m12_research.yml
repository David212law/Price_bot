name: M12 Research
on:
  schedule: [{ cron: '0 3 * * 6' }]
  workflow_dispatch:
permissions: { contents: write }

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - run: python3 m12/calc_test.py
      - run: cd m12/researcher && python3 prefilter.py
      - run: cd m12/researcher && python3 researcher.py
      - run: cd m12/researcher && python3 verify.py
      - if: always()
        run: |
          git config user.name bot
          git config user.email bot@bot
          git add m12/config.json m12/researcher/research/ || true
          git diff --staged --quiet || git commit -m "Auto: M12 research [skip ci]"
          git pull --rebase origin main || true
          git push || echo fail
