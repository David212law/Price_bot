name: Weekly Research

on:
  schedule:
    - cron: '0 3 * * 1'   # Every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pandas

      - name: Run composer only (skip profiler — too heavy)
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u -m research_lab.composer 2>&1 | tee composer.log || true
          echo "════ EXIT: $? ════"
          tail -60 composer.log

      - name: Bale Report
        if: always()
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          python << 'PYEOF'
import os, requests
try:
    from datetime import datetime, timezone
    log = open('composer.log').read() if os.path.exists('composer.log') else 'no log'
    idx = log.find('COMPLEMENTARY STRATEGIES')
    report = log[idx:idx+2000] if idx > 0 else log[-1500:]
    msg = "📊 Weekly Research " + datetime.now(timezone.utc).strftime("%Y-%m-%d") + "\n\n" + report
    tok = os.environ.get('BALE_BOT_TOKEN', '')
    chat = os.environ.get('BALE_CHAT_ID', '')
    if tok and chat:
        r = requests.post(f'https://tapi.bale.ai/bot{tok}/sendMessage',
                         json={'chat_id': chat, 'text': msg[:4000]}, timeout=20)
        print('Bale:', r.status_code)
except Exception as e:
    print('Bale error:', e)
PYEOF

      - name: Commit state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add research_lab/logs/ exchanges/portfolio_by_regime.json exchanges/pending_approvals.json 2>/dev/null || true
          if ! git diff --quiet --staged; then
            git commit -m "Auto: weekly research $(date -u +%Y-%m-%d) [skip ci]"
            git push || echo "push failed"
          else
            echo "no changes to commit"
          fi
