name: Weekly Research

on:
  schedule:
    - cron: '0 3 * * 1'   # Every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Run Composer
        run: python -m research_lab.composer

      - name: Generate Report
        run: python -m research_lab.composer_report

      # ارسال محتوای واقعی گزارش به بله
      - name: Send Bale Notification
        if: always()
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          python -c "
import os, requests
tok = os.environ.get('BALE_BOT_TOKEN')
chat = os.environ.get('BALE_CHAT_ID')
if tok and chat:
    try:
        with open('research_lab/logs/composer_summary.md', 'r') as f:
            report = f.read()
    except:
        report = 'Report file not found.'
    # Bale has a character limit, so we take the first 3500 chars
    msg = '📊 **Weekly Research Report**\n\n' + report[:3500]
    requests.post(f'https://tapi.bale.ai/bot{tok}/sendMessage', json={'chat_id': chat, 'text': msg})
"

      - name: Commit Report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f research_lab/logs/ || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto: weekly research [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
