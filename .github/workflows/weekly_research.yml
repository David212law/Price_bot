name: Weekly Research

on:
  schedule:
    - cron: '0 3 * * 1'   # Every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Run Composer
        run: python -m research_lab.composer

      - name: Generate Report
        run: python -m research_lab.composer_report

      - name: Commit Report
        run: |
          # تنظیم هویت گیت (دقیقاً همین‌جا، بدون هیچ جای دیگر)
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # اجبار به اضافه کردن همه لاگ‌ها
          git add -f research_lab/logs/ || true
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto: weekly research [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
