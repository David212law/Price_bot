name: Auto-Research & Optimize

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run Auto-Discovery
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python -m research_lab.auto_discovery
      - name: Validate Winner
        run: python -m research_lab.validate_winner
      - name: Run Portfolio Optimizer
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python -m research_lab.portfolio_optimizer
      - name: Upload Logs as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-logs
          path: research_lab/logs/
          retention-days: 30
