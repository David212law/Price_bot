name: Auto-Research & Optimize

on:
  schedule:
    - cron: '0 0 1 * *' # اجرا ماهی یک‌بار
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests numpy
      - name: Run Auto-Discovery
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python -m research_lab.auto_discovery
      - name: Validate Winner
        run: python -m research_lab.validate_winner
      - name: Run Portfolio Architect (Correlation)
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python -m research_lab.portfolio_optimizer
      - name: Commit Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add research_lab/logs/
          git commit -m "Automated: Research, Validation, and Portfolio Architecture" || echo "No changes"
          git push
