name: Auto-Research & Optimize

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run Auto-Discovery
        run: python -m research_lab.auto_discovery
      - name: Validate Winner (OOS & Stress)
        run: python -m research_lab.validate_winner
      - name: Run Portfolio Optimizer
        run: python -m research_lab.portfolio_optimizer
      - name: Commit Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add research_lab/logs/
          git commit -m "Auto-Research results, Validation, and Portfolio Optimization" || echo "No changes"
          git push
