name: Test Hyperliquid Funding T-Test

on:
  workflow_dispatch:

jobs:
  run-ttest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run T-Test
        run: python test_hyperliquid_funding_ttest.py
