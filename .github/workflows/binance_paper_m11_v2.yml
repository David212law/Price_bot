name: Binance M11-V2 Paper

on:
  schedule:
    - cron: '20 * * * *' # اجرا در دقیقه 5 هر ساعت
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests pandas numpy
      - name: Run M11-V2 Engine
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python exchanges/binance/run_m11_v2.py
concurrency:\n  group: ${{ github.workflow }}-${{ github.ref }}\n  cancel-in-progress: true
