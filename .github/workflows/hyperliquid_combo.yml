name: Hyperliquid COMBO Paper
on:
  schedule:
    - cron: '35 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hl-combo
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run HL COMBO
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python exchanges/hyperliquid/m11_hl_combo_allocator.py
      - name: Commit state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add exchanges/hyperliquid/state/m11_hl_combo_portfolio.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto: HL COMBO state [skip ci]"
            git push || echo "push failed"
          fi
