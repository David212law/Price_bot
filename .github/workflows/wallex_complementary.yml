name: Wallex Complementary Ensemble
on:
  workflow_dispatch:
  push:
    paths: ['scripts/wallex_complementary.py']
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy
      - run: python scripts/wallex_complementary.py 2>&1 | tee data/wallex_complementary_output.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/wallex_complementary_output.txt
          git diff --cached --quiet || (git commit -m "Auto: complementary ensemble [skip ci]" && git pull --rebase origin main && git push)
